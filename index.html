<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanksgiving Feast Crisis | Finite Mathematics</title><style>
:root{--bg:#1a1714;--panel:#30251e;--card:#423127;--line:#8a6248;--cream:#fff3df;--muted:#d8c5ae;--gold:#f5bc64;--green:#a9db99;--red:#ff9d91}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 5%,#593a25,transparent 42%),linear-gradient(#201912,#120f0d);color:var(--cream);font:16px/1.55 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--gold);font-weight:850}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,34px);margin:18px 0;box-shadow:0 16px 40px #0005}.hero{padding:30px;background:linear-gradient(120deg,#614027,#33251c);border-radius:15px}.kicker{text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-size:.82rem;font-weight:850}h1{font-size:clamp(2.1rem,5vw,3.6rem);line-height:1.12;margin:10px 0}h2{margin:12px 0;font-size:1.65rem}h3{margin:0 0 8px}p{max-width:75ch}.muted{color:var(--muted)}button,input{font:inherit}button{background:var(--gold);color:#24170e;border:0;border-radius:10px;padding:11px 16px;font-weight:850;cursor:pointer}button:hover{filter:brightness(1.07)}button:disabled{opacity:.45;cursor:not-allowed}input{width:100%;border:1px solid #a57d5b;border-radius:9px;background:#211a16;color:white;padding:12px;min-width:0}input:focus{outline:2px solid var(--gold)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.chip{border:1px solid #c18c59;border-radius:20px;padding:6px 12px}.progress{display:flex;gap:7px;margin:16px 0}.progress span{height:9px;flex:1;background:#594536;border-radius:8px}.progress .done{background:var(--green)}.progress .current{background:var(--gold)}.task{background:var(--card);border:1px solid #77543d;border-radius:14px;padding:19px;margin:16px 0}.task p{margin:9px 0}.answer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:15px}.answer input{max-width:250px}.feedback{font-weight:750;min-height:24px;margin-top:8px}.good{color:var(--green)}.bad{color:var(--red)}.note{background:#2a211c;border-left:4px solid var(--gold);padding:12px 16px;border-radius:8px;margin:12px 0}.unlock{background:#2c4431;border:1px solid #7cb18a;border-radius:12px;padding:18px;margin-top:18px}.hidden{display:none}.clue{font-size:1.5rem;font-weight:950;letter-spacing:.18em;color:#fff0a9}code,pre{font:15px/1.6 ui-monospace,monospace}pre{white-space:pre-wrap;background:#241e19;padding:13px;border-radius:9px;overflow:auto}.mini{font-size:.9rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.grid .task{margin:0}.footer{color:#bda68f;font-size:.86rem;padding:12px 0 25px}#clock{font-variant-numeric:tabular-nums}details{margin:12px 0}summary{cursor:pointer;color:var(--gold)}@media(max-width:560px){main{padding:12px}.panel{padding:17px}.hero{padding:18px}.answer input{max-width:100%}}
</style></head><body><main><header><span>🍁 FINITE MATHEMATICS · THANKSGIVING</span><span id="clock" class="chip">45:00</span></header><div id="app"></div><div class="footer">For pairs · Calculator and scratch paper encouraged · Show all reasoning on paper</div></main><script>
const rooms=[
{title:'The Catering Budget',topic:'Linear models · Break-even · Regression',story:'The catering company has misplaced its pricing sheet. Reconstruct the models to authorize the food order.',hint:'Use slope = change in cost / change in quantity. For regression, compute the least-squares slope from the three data points, not just the endpoints.',clue:'HARVEST',tasks:[
{q:'A caterer charges a fixed fee plus a constant amount per guest. The total is $1,160 for 40 guests and $1,760 for 70 guests. What is the fixed fee in dollars?',detail:'Write C(x)=mx+b, determine m, then b.',ans:'360',why:'Slope is (1760−1160)/30 = 20 dollars per guest; b=1160−20(40)=360.'},
{q:'A charity sells meal tickets for $32 each. Fixed costs are $360 and variable costs are $20 per meal. What is the smallest WHOLE number of tickets required to make at least $1,000 profit?',detail:'Profit = revenue − cost.',ans:'114',why:'12x−360 ≥ 1000, so x ≥ 113⅓; round up to 114.'},
{q:'For the data (1,4), (2,7), (4,8), use least-squares linear regression y=mx+b. What is the predicted y-value when x=5? Round to two decimal places.',detail:'Use a regression calculator or compute the least-squares coefficients by hand.',ans:'9.57',tolerance:.011,why:'The regression line has slope 17/14 ≈ 1.2143 and intercept 3.5; at x=5, the prediction is 67/7 ≈ 9.57.'}
]},
{title:'The Missing Food Orders',topic:'Matrix operations · Systems · Input-output',story:'The pantry delivery records are stored in matrices. Recover the missing quantities before the trucks leave.',hint:'Keep track of rows versus columns. When solving a matrix system, check your solution in every original equation.',clue:'TABLE',tasks:[
{q:'A delivery matrix has rows for two suppliers and columns for turkeys, pies, and sides: A = [[4, 6, 8], [3, 5, 7]]. A second shipment is B = [[2, 1, 3], [5, 2, 1]]. What is the total number of pies delivered by BOTH suppliers across BOTH shipments?',detail:'Add the entries in column 2 of A+B.',ans:'14',why:'Pies: 6+5+1+2=14.'},
{q:'The ingredient orders satisfy 2x+y=17 and x+3y=21. How many units of ingredient x are needed?',detail:'Solve using elimination, substitution, or an augmented matrix.',ans:'6',why:'From 2x+y=17, y=17−2x. Then x+3(17−2x)=21 gives x=6.'},
{q:'A 2×2 matrix A = [[3,2],[5,4]] is used to encode the final delivery. What is the entry in row 1, column 2 of A⁻¹?',detail:'Compute the inverse; enter the exact integer or fraction.',ans:'-1',why:'det(A)=12−10=2, so A⁻¹=(1/2)[[4,−2],[−5,3]].'}
]},
{title:'The Kitchen Optimization',topic:'Graphical LP · Simplex reasoning',story:'The kitchen can prepare two meal kits. Maximize the value of the shipment without violating ingredient limits.',hint:'For the graphical problem, test feasible corner points. In the simplex tableau, select the entering variable by the objective row and the leaving variable by the minimum positive ratio.',clue:'FEAST',tasks:[
{q:'Maximize P=5x+4y subject to x+y≤12, 2x+y≤18, x≥0, y≥0. What is the maximum value of P?',detail:'Find all feasible vertices and evaluate the objective.',ans:'54',why:'Vertices (0,0), (9,0), (6,6), (0,12) give P=0,45,54,48.'},
{q:'For that same LP, what is the x-coordinate of the optimal vertex?',detail:'Use the maximizing vertex from the previous problem.',ans:'6',why:'The optimal vertex is the intersection of x+y=12 and 2x+y=18: (6,6).'},
{q:'A simplex tableau starts with objective z−3x−5y=0 and constraints x+2y+s₁=8 and 3x+2y+s₂=12. If y enters first, which slack variable leaves the basis? Enter 1 for s₁ or 2 for s₂.',detail:'Apply the minimum positive ratio test to the y column.',ans:'1',why:'Ratios are 8/2=4 and 12/2=6, so s₁ leaves.'}
]},
{title:'The Thanksgiving Fund',topic:'Simple interest · Compound interest · Annuities',story:'The fundraiser has money in three accounts. Verify the balances before the bank releases the dinner funds.',hint:'Use the interest rate per payment period and the number of periods. For annuities, distinguish future value from present value.',clue:'GIVING',tasks:[
{q:'A $2,400 deposit earns 5% SIMPLE annual interest for 18 months. What is its final balance in dollars?',detail:'A=P(1+rt), with t measured in years.',ans:'2580',why:'A=2400(1+.05×1.5)=2580.'},
{q:'A $5,000 deposit earns 6% nominal annual interest, compounded monthly, for 2 years. What is the balance to the nearest cent?',detail:'Use A=P(1+r/n)^(nt).',ans:'5635.80',tolerance:.015,why:'5000(1+.06/12)^24 ≈ 5635.80.'},
{q:'A fundraiser deposits $200 at the END of every month for 12 months. The account earns 6% nominal annual interest compounded monthly. Find the future value to the nearest cent.',detail:'Use the future value of an ordinary annuity.',ans:'2467.11',tolerance:.015,why:'200[((1+.06/12)^12−1)/(.06/12)] ≈ 2467.11.'}
]},
{title:'The Final Security Lock',topic:'Logic · Truth tables · Valid arguments',story:'The dining room security system accepts only logically consistent statements. Complete the checks and recover the final code.',hint:'For implication p→q, the only false case is p true and q false. For validity, look for a counterexample with true premises and false conclusion.',clue:'TOGETHER',tasks:[
{q:'How many rows of a complete truth table make (p→q) ∧ (q→r) ∧ p TRUE?',detail:'Use three independent propositions p, q, r.',ans:'1',why:'p must be true; then q must be true; then r must be true. Only TTT works.'},
{q:'How many assignments of truth values make (p∨q) ∧ ¬(p∧q) true?',detail:'This is exclusive OR (XOR).',ans:'2',why:'Exactly one of p and q must be true: TF or FT.'},
{q:'An argument has premises p→q and q, and conclusion p. Enter 1 if the argument is valid, or 0 if it is invalid.',detail:'Consider whether q being true forces p to be true.',ans:'0',why:'This is affirming the consequent. For example p=F and q=T makes both premises true but the conclusion false.'}
]}
];
let team='',room=0,done=[],remaining=2700,ticker=null,finished=false,hintsUsed=0;
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function time(){let m=Math.floor(remaining/60),s=remaining%60;$('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function welcome(){$('app').innerHTML=`<section class="panel"><div class="hero"><div class="kicker">Five locked rooms · One missing feast</div><h1>The Thanksgiving Feast Crisis 🦃</h1><p>The caterer has lost the budget, the delivery orders are scrambled, the kitchen schedule is impossible, and the dining-room security system is locked. You have 45 minutes to rescue the celebration.</p></div><p><b>Work in pairs.</b> Solve every challenge in each room. Write down the clue after each room; the final lock requires the complete five-word password. Use paper and calculators, but explain every answer to your partner before submitting.</p><p>Incorrect answers don't advance. Optional hints cost 90 seconds. The timer continues even if it reaches zero, so everyone can finish.</p><label for="team">Team name</label><input id="team" maxlength="60" placeholder="e.g., The Optimization Turkeys"><button style="margin-top:15px" onclick="start()">Enter the Feast Crisis →</button><div id="welcomeErr" class="feedback bad"></div></section>`;}
function start(){team=$('team').value.trim();if(!team){$('welcomeErr').textContent='Please enter a team name.';return;}room=0;remaining=2700;hintsUsed=0;finished=false;clearInterval(ticker);ticker=setInterval(()=>{if(!finished&&remaining>0){remaining--;time();}},1000);time();render();}
function render(){done=rooms[room].tasks.map(()=>false);const r=rooms[room];$('app').innerHTML=`<section class="panel"><div class="row" style="justify-content:space-between"><span class="kicker">Room ${room+1} of 5</span><span class="chip">${esc(team)}</span></div><div class="progress">${rooms.map((_,i)=>`<span class="${i<room?'done':i===room?'current':''}"></span>`).join('')}</div><h1>${esc(r.title)}</h1><p>${esc(r.story)}</p><div class="note">${esc(r.topic)} · Three challenges · Record your reasoning on paper</div>${r.tasks.map((t,i)=>`<article class="task"><h3>Challenge ${i+1}</h3><p>${esc(t.q)}</p><p class="muted mini">${esc(t.detail)}</p><div class="answer"><input id="answer${i}" aria-label="Answer to challenge ${i+1}" placeholder="Enter numerical answer" onkeydown="if(event.key==='Enter')check(${i})"><button id="check${i}" onclick="check(${i})">Check</button></div><div class="feedback" id="feed${i}" aria-live="polite"></div></article>`).join('')}<div class="row" style="justify-content:space-between"><button id="hintBtn" onclick="hint()">Hint (−1:30)</button><span class="chip" id="count">0 / 3 correct</span></div><div class="muted" id="hintArea"></div><div class="unlock hidden" id="unlock"></div></section>`;}
function parseAnswer(s){let x=s.trim().replace(/[$,\s]/g,'');if(/^[-+]?\d+(\.\d+)?\/[-+]?\d+(\.\d+)?$/.test(x)){let [a,b]=x.split('/').map(Number);return b? a/b:NaN;}return Number(x);}
function check(i){if(done[i])return;let t=rooms[room].tasks[i],raw=$('answer'+i).value;if(!raw.trim()){feedback(i,false,'Enter an answer first.');return;}let value=parseAnswer(raw),expected=parseAnswer(t.ans),ok=Number.isFinite(value)&&Math.abs(value-expected)<=(t.tolerance??.000001);if(ok){done[i]=true;$('answer'+i).disabled=true;$('check'+i).disabled=true;feedback(i,true,'✓ Correct! '+t.why);}else feedback(i,false,'Not quite. Check your setup and calculations.');$('count').textContent=done.filter(Boolean).length+' / 3 correct';if(done.every(Boolean)){$('unlock').classList.remove('hidden');$('unlock').innerHTML=`<div class="kicker">Room unlocked</div><p>Your recovered clue is <span class="clue">${rooms[room].clue}</span>. Write it down!</p><button onclick="next()">${room===4?'Go to the Final Lock →':'Enter the Next Room →'}</button>`;}}
function feedback(i,ok,s){let f=$('feed'+i);f.className='feedback '+(ok?'good':'bad');f.textContent=s;}
function hint(){let b=$('hintBtn');if(b.disabled)return;b.disabled=true;remaining=Math.max(0,remaining-90);time();hintsUsed++;$('hintArea').textContent='Hint: '+rooms[room].hint;}
function next(){if(!done.every(Boolean))return;if(room<4){room++;render();}else lock();}
function lock(){$('app').innerHTML=`<section class="panel"><div class="hero"><div class="kicker">Final challenge</div><h1>The Dining Room Lock 🔐</h1><p>Use the five clues you collected, in room order, to enter the final password. Separate the five words with spaces.</p></div><div class="answer"><input id="password" placeholder="Five-word password" onkeydown="if(event.key==='Enter')unlockFinal()"><button onclick="unlockFinal()">Unlock the Feast</button></div><div id="lockFeedback" class="feedback"></div></section>`;}
function unlockFinal(){let entered=$('password').value.trim().toUpperCase().replace(/\s+/g,' '),correct=rooms.map(r=>r.clue).join(' ');if(entered===correct){finished=true;clearInterval(ticker);$('app').innerHTML=`<section class="panel"><div class="hero"><div class="kicker">Mission complete</div><h1>Thanksgiving Is Saved! 🍁</h1><p>Congratulations, <b>${esc(team)}</b>! You restored the budget, deliveries, kitchen plan, funding, and security system.</p><p>Time remaining: <b>${$('clock').textContent}</b> · Hints used: <b>${hintsUsed}</b></p><button onclick="clearInterval(ticker);$('clock').textContent='45:00';welcome()">Start a New Team</button></div></section>`;}else{$('lockFeedback').className='feedback bad';$('lockFeedback').textContent='That password does not match. Check the order and spelling of your five clues.';}}
welcome();
</script></body></html>
